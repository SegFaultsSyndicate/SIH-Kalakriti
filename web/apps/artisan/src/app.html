<!doctype html>
<html lang="hi" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover so the capture screens can use the full display on a
      notched phone. maximum-scale and user-scalable are deliberately absent:
      pinch-zoom is an accessibility feature and disabling it fails WCAG 1.4.4.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#963D14" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <!-- iOS installs from Safari do not read the manifest for these. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kalakriti" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
    <!--
      The manifest link is written here rather than left to the PWA plugin:
      the plugin injects it into prerendered pages, and this app has none --
      every route is served from the SPA fallback, so the injection point
      never runs and the app silently fails the installability audit.
    -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <!--
      preload-data="tap", not "hover": the artisan app is touch-only and on a
      metered 2G connection, so speculative prefetching on every finger-drag
      spends data the user is paying for.
    -->
    <div style="display: contents">%sveltekit.body%</div>
    <noscript>
      <p style="padding: 1rem; font: 1rem system-ui">
        कलाकृति चलाने के लिए जावास्क्रिप्ट ज़रूरी है। कृपया अपने ब्राउज़र में इसे चालू करें।
        <br />
        Kalakriti needs JavaScript. Please enable it in your browser.
      </p>
    </noscript>
  </body>
</html>
