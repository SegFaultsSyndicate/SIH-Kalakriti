<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- Upload-zone drop area, one asset with four states (idle, drag-over, uploading, success, error) toggled by the k-upload-zone[data-state] CSS in icons.css, which shows exactly one <g> at a time. The dashed border is CSS (border-style:dashed) on the host element, not drawn here. -->
  <g data-upload-state="idle">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 15 L12 7 L9 10"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 7 L15 10"/>
  </g>
  <g data-upload-state="drag">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 16 L12 6 L8 10"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 6 L16 10"/>
  </g>
  <g data-upload-state="uploading">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M13.37 7.24 A4 4 0 1 1 8.24 9.63"/>
  </g>
  <g data-upload-state="success">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M7 11 A5 5 0 1 0 17 11 A5 5 0 1 0 7 11"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M9.2 11.2 L 11 13 L 14.8 8.8"/>
  </g>
  <g data-upload-state="error">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M7 11 A5 5 0 1 0 17 11 A5 5 0 1 0 7 11"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M10 9 L14 13"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M14 9 L10 13"/>
  </g>
</svg>
