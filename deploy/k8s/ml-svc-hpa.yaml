# deploy/k8s/ml-svc-hpa.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-svc
  labels:
    app: ml-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-svc
  template:
    metadata:
      labels:
        app: ml-svc
    spec:
      containers:
      - name: ml-svc
        image: kalakriti/ml-svc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: GRPC_PORT
          value: "50051"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: ml-svc
spec:
  selector:
    app: ml-svc
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-svc-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
