<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- Jaali. Decorative surround for the provenance QR. The QR itself is NOT drawn here — the consuming page places its own QR image inside the 172.8x172.8 clear inner square (out of a 240x240 frame), which reserves 14% of the frame on every side as quiet zone. Per ISO/IEC 18004 a QR needs a quiet zone of at least 4 modules; at the smallest module count this system's QR uses (~25 modules across for a typical provenance URL), 14% of the frame is several modules, comfortably over the minimum, but the exact margin depends on the QR's own module count and must be confirmed for the final printed size. THIS HAS NOT BEEN VERIFIED WITH A REAL PHONE SCAN — the prompt pack's own warning: test with a printed tag before week three, not on demo morning. -->
