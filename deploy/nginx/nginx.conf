# /etc/nginx/nginx.conf
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Upstream to Go BFF
    upstream bff_upstream {
        server bff:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Common proxy headers map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 1. Buyer Marketplace (Main Web App & Default Server)
    # Serves: kalakriti.in, buy.kalakriti.in, localhost (default)
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name kalakriti.in www.kalakriti.in buy.kalakriti.in localhost;

        root /var/www/buyer;
        index index.html;

        # Hashed static assets (immutable cache for 1 year)
        location /_app/immutable/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Service worker & manifest (never cache)
        location ~* (sw\.js|service-worker\.js|manifest\.webmanifest)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # SSR & SEO pages handled by Go BFF (Server-rendered HTML)
        location ~ ^/(listing/|artisan/|v/|sitemap\.xml|robots\.txt|export/) {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # API Gateway proxy (REST API & SSE stream)
        location /api/ {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events (SSE) support for /api/v1/orders/:id/events
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # Artisan Studio and the Ministry Console are NOT served path-prefixed
        # under this host (localhost/artisan/, localhost/admin/) -- both
        # adapter-static builds bake absolute, root-relative asset URLs
        # (paths.relative: false, no kit.paths.base), so a path prefix here
        # served the wrong app's /_app/immutable/ bundle against this
        # block's own `root /var/www/buyer` and also permanently shadowed
        # the BFF's `/artisan/:slug` SEO route below (nginx gives `^~`
        # prefix matches precedence over regex matches regardless of
        # specificity). See WIRING_AUDIT_PLAN.md F-7. Reach them on their
        # own ports instead -- see the artisan/admin server blocks below.

        # SPA Routing: Fall back to buyer index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Health check endpoint for container / k8s
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 2. Artisan Portal (Offline-first PWA)
    # Serves: artisan.kalakriti.in
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        # :8081 is this stack's local-development / single-IP entry point
        # for Artisan Studio (localhost:8081) -- see WIRING_AUDIT_PLAN.md
        # F-7 for why a path prefix under the buyer host doesn't work here.
        listen 8081;
        listen [::]:8081;
        server_name artisan.kalakriti.in;

        root /var/www/artisan;
        index index.html;

        # Strict no-store for PWA service worker and Web App Manifest
        location ~* (sw\.js|service-worker\.js|workbox-.*\.js|manifest\.webmanifest)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # Immutable static chunks
        location /_app/immutable/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # API Proxy to Go BFF
        location /api/ {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # SPA Fallback for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 3. Ministry & Cluster Admin Portal
    # Serves: admin.kalakriti.in
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        # :8082 is this stack's local-development / single-IP entry point
        # for the Ministry Console (localhost:8082) -- see
        # WIRING_AUDIT_PLAN.md F-7.
        listen 8082;
        listen [::]:8082;
        server_name admin.kalakriti.in;

        root /var/www/admin;
        index index.html;

        # Immutable static chunks
        location /_app/immutable/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # API Proxy to Go BFF
        location /api/ {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # SPA Fallback for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 4. Direct API Subdomain (Optional convenience)
    # Serves: api.kalakriti.in -> proxies directly to BFF
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name api.kalakriti.in;

        client_max_body_size 15M;

        location / {
            proxy_pass http://bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }
    }
}
