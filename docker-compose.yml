# docker-compose.yml

services:
  # Infrastructure
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: kalakriti
      POSTGRES_USER: kalakriti
      POSTGRES_PASSWORD: kalakriti
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalakriti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/confluent-local:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ja3_hAH_QZy-U4RiCUtuQQ
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket the services expect (S3_BUCKET) before they start.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb -p local/kalakriti"
    restart: "no"

  # Application Services
  core-svc:
    build:
      context: .
      dockerfile: Dockerfile.core-svc
    environment:
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: dev-secret-change-in-prod-32bytes-minimum
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      S3_BUCKET: kalakriti
      ML_SVC_ADDR: ml-svc:50055
      OTLP_ENDPOINT: jaeger:4317
    ports:
      # main.go defaults: CORE_SVC_GRPC_ADDR :50051, CORE_SVC_HTTP_ADDR :8081
      # (the old 8080/9090 mapping matched neither port core-svc actually
      # listens on, and 9090 collided with prometheus's own port below).
      - "50051:50051"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ml-svc:
        condition: service_started
    restart: unless-stopped

  search-svc:
    build:
      context: .
      dockerfile: Dockerfile.search-svc
    environment:
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      # core-svc's gRPC port (main.go default CORE_SVC_GRPC_ADDR :50051) —
      # was pointing at core-svc's HTTP port instead.
      CORE_SVC_ADDR: core-svc:50051
      ML_SVC_ADDR: ml-svc:50055
      OTLP_ENDPOINT: jaeger:4317
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      S3_BUCKET: kalakriti
    ports:
      - "8082:8082"
      # search-svc's own gRPC port (main.go default SEARCH_SVC_GRPC_ADDR
      # :50052) — the old 9092 mapping didn't correspond to anything
      # search-svc listens on, and collided with kafka's own 9092.
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      core-svc:
        condition: service_started
    restart: unless-stopped

  collab-svc:
    build:
      context: .
      dockerfile: Dockerfile.collab-svc
    environment:
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      CORE_SVC_ADDR: core-svc:50051
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8083:8083"
      # collab-svc's own gRPC port (main.go default :50053) — the old 9093
      # mapping didn't correspond to anything collab-svc listens on.
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-svc:
        condition: service_started
    restart: unless-stopped

  channel-svc:
    build:
      context: .
      dockerfile: Dockerfile.channel-svc
    environment:
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      CORE_SVC_ADDR: core-svc:50051
      OTLP_ENDPOINT: jaeger:4317
      CHANNEL_SVC_HTTP_ADDR: ":8084"
      CHANNEL_SVC_GRPC_ADDR: ":9096"
    ports:
      - "8084:8084"
      - "9096:9096"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-svc:
        condition: service_started
    restart: unless-stopped

  insight-svc:
    build:
      context: .
      dockerfile: Dockerfile.insight-svc
    environment:
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      S3_BUCKET: kalakriti
      OTLP_ENDPOINT: jaeger:4317
    ports:
      # insight-svc's only listener (main.go default GRPC_ADDR :8085) — the
      # old second entry, 9094, didn't correspond to anything it listens on.
      - "8085:8085"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: Dockerfile.bff
    environment:
      # main.go default is :8080, but BASE_URL, deploy/nginx/nginx.conf and
      # deploy/k8s/configmap.yaml all assume bff answers on 8000 — set
      # explicitly so the container actually binds what everything else
      # already assumes.
      ADDR: ":8000"
      # core-svc, search-svc and collab-svc's own gRPC ports (see their
      # main.go defaults: CORE_SVC_GRPC_ADDR :50051, search-svc's grpcAddr
      # :50052, collab-svc's defaultGRPCAddr :50053) — these were pointing at
      # the services' HTTP ports instead.
      CORE_SVC_ADDR: core-svc:50051
      SEARCH_SVC_ADDR: search-svc:50052
      COLLAB_SVC_ADDR: collab-svc:50053
      # channel-svc's own gRPC port (see its CHANNEL_SVC_GRPC_ADDR above,
      # :9096) — distinct from CHANNEL_SVC_ADDR, which nothing here sets and
      # which is channel-svc's HTTP port, used elsewhere.
      CHANNEL_SVC_GRPC_ADDR: channel-svc:9096
      INSIGHT_SVC_ADDR: insight-svc:8085
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      BASE_URL: http://localhost:8000
      JWT_SECRET: dev-secret-change-in-prod-32bytes-minimum
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8000:8000"
      - "9095:9095"
    depends_on:
      - postgres
      - redis
      - core-svc
      - search-svc
      - collab-svc
      - channel-svc
      - insight-svc
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - bff
    restart: unless-stopped

  ml-svc:
    build:
      context: .
      dockerfile: Dockerfile.ml-svc
    environment:
      ML_SVC_GRPC_PORT: "50055"
      ML_SVC_METRICS_PORT: "9095"
      ML_SVC_MOCK_MODE: "true"
    ports:
      - "50055:50055"
      # host 9097, not 9095: bff's k8s manifest reserves 9095 for its own
      # (currently unimplemented) metrics endpoint; this avoids the clash.
      - "9097:9095"
    restart: unless-stopped

  # Observability
  jaeger:
    image: jaegertracing/all-in-one:1.51
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.47.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  pg_data:
  minio_data:
  prometheus_data:
