# docker-compose.full.yml
version: '3.8'

services:
  # Infrastructure
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: kalakriti
      POSTGRES_USER: kalakriti
      POSTGRES_PASSWORD: kalakriti
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalakriti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/confluent-local:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: kalakriti-cluster-123
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Services
  core-svc:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.core-svc
    environment:
      DATABASE_URL: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: dev-secret-change-in-prod
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      ML_SVC_ADDR: ml-svc:50051
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      ml-svc:
        condition: service_started
    restart: unless-stopped

  search-svc:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.search-svc
    environment:
      DATABASE_URL: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      CORE_SVC_ADDR: core-svc:8080
      ML_SVC_ADDR: ml-svc:50051
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8082:8082"
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-svc:
        condition: service_started
    restart: unless-stopped

  collab-svc:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.collab-svc
    environment:
      DATABASE_URL: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      CORE_SVC_ADDR: core-svc:8080
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8083:8083"
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-svc:
        condition: service_started
    restart: unless-stopped

  channel-svc:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.channel-svc
    environment:
      DATABASE_URL: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      CORE_SVC_ADDR: core-svc:8080
      OTLP_ENDPOINT: jaeger:4317
      CHANNEL_SVC_HTTP_ADDR: ":8084"
      CHANNEL_SVC_GRPC_ADDR: ":9096"
    ports:
      - "8084:8084"
      - "9096:9096"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      core-svc:
        condition: service_started
    restart: unless-stopped

  insight-svc:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.insight-svc
    environment:
      DATABASE_URL: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8085:8085"
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.bff
    environment:
      # core-svc, search-svc and collab-svc's own gRPC ports (see their
      # main.go defaults: CORE_SVC_GRPC_ADDR :50051, search-svc's grpcAddr
      # :50052, collab-svc's defaultGRPCAddr :50053) — these were pointing at
      # the services' HTTP ports instead.
      CORE_SVC_ADDR: core-svc:50051
      SEARCH_SVC_ADDR: search-svc:50052
      COLLAB_SVC_ADDR: collab-svc:50053
      INSIGHT_SVC_ADDR: insight-svc:8085
      POSTGRES_DSN: postgres://kalakriti:kalakriti@postgres:5432/kalakriti?sslmode=disable
      REDIS_ADDR: redis:6379
      BASE_URL: http://localhost:8000
      JWT_SECRET: dev-secret-change-in-prod
      OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8000:8000"
      - "9095:9095"
    depends_on:
      - postgres
      - redis
      - core-svc
      - search-svc
      - collab-svc
      - insight-svc
    restart: unless-stopped

  ml-svc:
    build:
      context: ./kalakriti
      dockerfile: ../Dockerfile.ml-svc
    environment:
      GRPC_PORT: "50051"
      MOCK_MODE: "true"
    ports:
      - "50051:50051"
    restart: unless-stopped

  # Observability
  jaeger:
    image: jaegertracing/all-in-one:1.51
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.47.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  pg_data:
  minio_data:
  prometheus_data:
