# deploy/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-svc'
    static_configs:
      - targets: ['user-svc:9090']

  - job_name: 'catalog-svc'
    static_configs:
      - targets: ['catalog-svc:9091']

  - job_name: 'search-svc'
    static_configs:
      - targets: ['search-svc:9092']

  - job_name: 'order-svc'
    static_configs:
      - targets: ['order-svc:9093']

  - job_name: 'social-svc'
    static_configs:
      - targets: ['social-svc:9094']

  - job_name: 'bff'
    static_configs:
      - targets: ['bff:9095']

  - job_name: 'pipeline-orchestrator'
    static_configs:
      - targets: ['pipeline-orchestrator:9096']
