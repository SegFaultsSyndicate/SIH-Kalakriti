# deploy/k8s/ml-svc-hpa.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-svc
  labels:
    app: ml-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-svc
  template:
    metadata:
      labels:
        app: ml-svc
    spec:
      containers:
      - name: ml-svc
        image: kalakriti/ml-svc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50055
          name: grpc
        env:
        # app/config.py reads ML_SVC_GRPC_PORT (default 50055, matching
        # docker-compose.yml) -- this manifest previously set the unread
        # name GRPC_PORT to the wrong value 50051 and was never
        # smoke-tested against the real service.
        - name: ML_SVC_GRPC_PORT
          value: "50055"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: ml-svc
spec:
  # Headless: gRPC clients dial "dns:///ml-svc:50055" with round_robin load
  # balancing (pkg/grpcdial), which needs CoreDNS to return one A record per
  # pod -- a normal ClusterIP Service returns only the virtual IP and pins
  # every client to a single pod regardless of replica count.
  clusterIP: None
  selector:
    app: ml-svc
  ports:
  - name: grpc
    port: 50055
    targetPort: 50055
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-svc-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
