[project]
name = "ml-svc"
version = "0.1.0"
description = "Kalakriti ML gRPC service: enhancement, attribute extraction, copy, embeddings, provenance checks"
requires-python = "==3.11.*"

# Mock mode is the default, so the default install is small enough to start in a
# second and to run in CI. Real weights come from the `real` extra.
dependencies = [
    "grpcio==1.64.1",
    "grpcio-health-checking==1.64.1",
    "grpcio-reflection==1.64.1",
    "protobuf==5.27.1",
    "prometheus-client==0.20.0",
]

[project.optional-dependencies]
real = [
    "numpy==1.26.4",
    "pillow==10.4.0",
    "torch==2.4.0",
    # 4.44.2 predates Qwen2.5-VL support entirely (KeyError: 'qwen2_5_vl');
    # 4.49.0 is the first stable release with Qwen2_5_VLForConditionalGeneration,
    # which app/models/vlm/real.py imports to match VLMConfig's default repo
    # (Qwen/Qwen2.5-VL-3B-Instruct).
    "transformers==4.49.0",
    "accelerate==0.34.2",
    # 4-bit-quantizes the VLM on CUDA hosts (see app/models/vlm/real.py's
    # _load) so a 3B checkpoint fits a small laptop GPU. Unused on CPU.
    "bitsandbytes==0.45.5",
    "sentence-transformers==3.0.1",
    "rembg[cli]==2.0.59",
    "opencv-python-headless==4.10.0.84",
    "minio==7.2.7",
    "IndicTransToolkit==1.1.1",
    "httpx==0.27.0",
]
dev = [
    "grpcio-tools==1.64.1",
    "pytest==8.3.2",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
ml-svc = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*", "pb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
