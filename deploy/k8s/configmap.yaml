# deploy/k8s/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kalakriti-config
data:
  redis-addr: "redis:6379"
  kafka-brokers: "kafka:9092"
  otlp-endpoint: "jaeger:4317"
  minio-endpoint: "minio:9000"
  minio-use-ssl: "false"
  bff-addr: "bff:8000"
  web-addr: "web:80"
  # Removed: user-svc-addr/catalog-svc-addr/order-svc-addr/social-svc-addr
  # (no matching Deployment under services/ -- likely a stale pre-rename
  # draft) and ml-svc-addr (wrong port 50051, real port is 50055). None of
  # these were ever referenced via configMapKeyRef by any manifest -- each
  # service's Deployment sets its own peer *_ADDR env vars directly (see
  # bff-deployment.yaml, core-svc-deployment.yaml, etc.), so there was
  # nothing to fix here except delete the dead, wrong entries.
