# deploy/k8s/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kalakriti-config
data:
  redis-addr: "redis:6379"
  kafka-brokers: "kafka:9092"
  otlp-endpoint: "jaeger:4317"
  minio-endpoint: "minio:9000"
  minio-use-ssl: "false"
  user-svc-addr: "user-svc:8080"
  catalog-svc-addr: "catalog-svc:8081"
  search-svc-addr: "search-svc:8082"
  order-svc-addr: "order-svc:8083"
  social-svc-addr: "social-svc:8084"
  ml-svc-addr: "ml-svc:50051"
