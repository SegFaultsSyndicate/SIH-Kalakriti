# deploy/k8s/search-svc-hpa.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-svc
  labels:
    app: search-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-svc
  template:
    metadata:
      labels:
        app: search-svc
    spec:
      containers:
      - name: search-svc
        image: kalakriti/search-svc:latest
        imagePullPolicy: IfNotPresent
        ports:
        # Real ports per services/search-svc/cmd/search-svc/main.go's
        # envOr defaults: SEARCH_SVC_GRPC_ADDR :50052, SEARCH_SVC_HTTP_ADDR
        # :8082 -- this manifest previously had them backwards (8082 named
        # "grpc") and probed a port 9092 the service never listens on.
        - containerPort: 50052
          name: grpc
        - containerPort: 8082
          name: http
        env:
        # pkg/config reads POSTGRES_DSN, not DATABASE_URL (see CLAUDE.md's
        # .env.example section) -- this manifest set a name the service
        # never reads and was never smoke-tested.
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: kalakriti-secrets
              key: database-url
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: redis-addr
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: kafka-brokers
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: otlp-endpoint
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: search-svc
spec:
  # Headless: bff dials "dns:///search-svc:50052" with round_robin load
  # balancing (pkg/grpcdial), which needs CoreDNS to return one A record per
  # pod -- a normal ClusterIP Service returns only the virtual IP and pins
  # every client to a single pod regardless of replica count.
  clusterIP: None
  selector:
    app: search-svc
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
  - name: http
    port: 8082
    targetPort: 8082
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-svc-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
