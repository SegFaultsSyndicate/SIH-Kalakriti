<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#963D14" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
    <!--
      The manifest link is written here rather than left to the PWA plugin:
      the plugin injects it into prerendered pages, and this app has none --
      every route is served from the SPA fallback, so the injection point
      never runs and the app silently fails the installability audit.
    -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <noscript>
      <p style="padding: 1rem; font: 1rem system-ui">
        Kalakriti needs JavaScript. Public listing and artisan pages are also served as plain
        HTML at the same address.
      </p>
    </noscript>
  </body>
</html>
