# deploy/k8s/collab-svc-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-svc
  labels:
    app: collab-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collab-svc
  template:
    metadata:
      labels:
        app: collab-svc
    spec:
      containers:
      - name: collab-svc
        image: kalakriti/collab-svc:latest
        imagePullPolicy: IfNotPresent
        # Real ports per services/collab-svc/cmd/collab-svc/main.go's
        # defaultGRPCAddr/defaultHTTPAddr (COLLAB_GRPC_ADDR/COLLAB_HTTP_ADDR
        # env vars are left unset here, same as docker-compose.yml, so the
        # service falls back to these same defaults).
        ports:
        - containerPort: 50053
          name: grpc
        - containerPort: 8083
          name: http
        env:
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: kalakriti-secrets
              key: database-url
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: redis-addr
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: kafka-brokers
        - name: CORE_SVC_ADDR
          value: "core-svc:50051"
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: otlp-endpoint
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: collab-svc
spec:
  # Headless: bff dials "dns:///collab-svc:50053" with round_robin load
  # balancing (pkg/grpcdial) -- see core-svc-deployment.yaml's Service for
  # why headless is required, not optional.
  clusterIP: None
  selector:
    app: collab-svc
  ports:
  - name: grpc
    port: 50053
    targetPort: 50053
  - name: http
    port: 8083
    targetPort: 8083
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collab-svc-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collab-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
