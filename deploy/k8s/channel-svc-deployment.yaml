# deploy/k8s/channel-svc-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-svc
  labels:
    app: channel-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: channel-svc
  template:
    metadata:
      labels:
        app: channel-svc
    spec:
      containers:
      - name: channel-svc
        image: kalakriti/channel-svc:latest
        imagePullPolicy: IfNotPresent
        # Real ports per docker-compose.yml / services/channel-svc/cmd/
        # channel-svc/main.go (its own code default for HTTP is :8083, which
        # collides with collab-svc's default -- docker-compose.yml overrides
        # it to :8084, matched here).
        ports:
        - containerPort: 9096
          name: grpc
        - containerPort: 8084
          name: http
        env:
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: kalakriti-secrets
              key: database-url
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: redis-addr
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: kafka-brokers
        - name: CORE_SVC_ADDR
          value: "core-svc:50051"
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: kalakriti-config
              key: otlp-endpoint
        - name: CHANNEL_SVC_HTTP_ADDR
          value: ":8084"
        - name: CHANNEL_SVC_GRPC_ADDR
          value: ":9096"
        livenessProbe:
          httpGet:
            # channel-svc only exposes /health (no separate /readyz) --
            # see main.go's httpMux.HandleFunc("/health", ...).
            path: /health
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: channel-svc
spec:
  # Headless: bff dials "dns:///channel-svc:9096" with round_robin load
  # balancing (pkg/grpcdial) -- see core-svc-deployment.yaml's Service for
  # why headless is required, not optional.
  clusterIP: None
  selector:
    app: channel-svc
  ports:
  - name: grpc
    port: 9096
    targetPort: 9096
  - name: http
    port: 8084
    targetPort: 8084
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: channel-svc-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channel-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
