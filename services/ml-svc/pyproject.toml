[project]
name = "ml-svc"
version = "0.1.0"
description = "Kalakriti ML gRPC service: enhancement, attribute extraction, copy, embeddings, provenance checks"
requires-python = "==3.11.*"

# Mock mode is the default, so the default install is small enough to start in a
# second and to run in CI. Real weights come from the `real` extra.
dependencies = [
    "grpcio==1.64.1",
    "grpcio-health-checking==1.64.1",
    "grpcio-reflection==1.64.1",
    "protobuf==5.27.1",
    "prometheus-client==0.20.0",
]

[project.optional-dependencies]
real = [
    "numpy==1.26.4",
    "pillow==10.4.0",
    "torch==2.4.0",
    # 4.44.2 predates Qwen2.5-VL support entirely (KeyError: 'qwen2_5_vl');
    # 4.49.0 is the first stable release with Qwen2_5_VLForConditionalGeneration,
    # which app/models/vlm/real.py imports to match VLMConfig's default repo
    # (Qwen/Qwen2.5-VL-3B-Instruct).
    "transformers==4.49.0",
    "accelerate==0.34.2",
    # 4-bit-quantizes the VLM on CUDA hosts (see app/models/vlm/real.py's
    # _load) so a 3B checkpoint fits a small laptop GPU. Unused on CPU.
    "bitsandbytes==0.45.5",
    # [onnx] extra pulls in optimum[onnxruntime] + onnxruntime (CPU) --
    # embedding/reranking run through ONNX Runtime by default now (see
    # app/models/embedding, app/models/reranking); this is what lets
    # SentenceTransformer/CrossEncoder export a cached torch checkpoint to
    # ONNX on first load instead of just running it eagerly. 4.1.0 is the
    # first release with backend="onnx" support on CrossEncoder as well as
    # SentenceTransformer.
    "sentence-transformers[onnx]==4.1.0",
    # Pinned explicitly, below whatever [onnx] would otherwise resolve to
    # latest: onnxruntime versions after 1.22.0 added int4/uint4 entries to
    # transformers/io_binding_helper.py's ORT-type-to-torch-dtype map that
    # reference torch.int4 unconditionally (even for models using neither
    # dtype) -- torch.int4 doesn't exist before torch 2.5 (this project pins
    # torch==2.4.0 for Qwen2.5-VL/bitsandbytes compatibility, see below), so
    # any onnxruntime newer than this crashes
    # `AttributeError: module 'torch' has no attribute 'int4'` on every
    # real-mode embedding/reranking load, not just int4-quantized ones.
    # Confirmed empirically: 1.17.3 through 1.22.0 lack these entries,
    # 1.29.0 (latest as of this pin) has them.
    "onnxruntime==1.22.0",
    "rembg[cli]==2.0.59",
    "opencv-python-headless==4.10.0.84",
    "minio==7.2.7",
    "IndicTransToolkit==1.1.1",
    "httpx==0.27.0",
]
# On a CUDA host, install this *instead of* plain `real`'s CPU onnxruntime
# (the two packages conflict -- same import name, different wheel) to get
# the ONNX embedding/reranking backends running on GPU via CUDAExecutionProvider:
#   uv sync --extra real --extra onnx-gpu
# then `uv pip uninstall onnxruntime` if uv installed both (extras don't
# express "replaces", only "adds").
onnx-gpu = [
    "sentence-transformers[onnx-gpu]==4.1.0",
    # See the onnxruntime==1.22.0 comment under `real` -- same torch.int4
    # incompatibility applies to the GPU wheel.
    "onnxruntime-gpu==1.22.0",
]
dev = [
    "grpcio-tools==1.64.1",
    "pytest==8.3.2",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
ml-svc = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*", "pb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
