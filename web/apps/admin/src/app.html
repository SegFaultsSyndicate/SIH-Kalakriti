<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#963D14" />
    <meta name="color-scheme" content="light dark" />
    <!-- Internal tool: keep it out of every index. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <noscript>
      <p style="padding: 1rem; font: 1rem system-ui">
        The Kalakriti administration dashboard needs JavaScript.
      </p>
    </noscript>
  </body>
</html>
